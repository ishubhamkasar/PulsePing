name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      artifact_run_id:
        description: Existing successful workflow run containing the unsigned artifact
        required: false
        type: string
      release_tag:
        description: Existing GitHub release tag that receives the unsigned evaluation archive
        required: false
        type: string

permissions:
  contents: read

jobs:
  build-windows-x64:
    if: github.event_name != 'workflow_dispatch' || inputs.artifact_run_id == ''
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Verify updater
        shell: pwsh
        run: dotnet run --project tests/PulsePing.UpdateChecks/Checks.csproj

      - name: Build standalone executable
        shell: pwsh
        run: ./scripts/Build-Release.ps1

      - name: Upload unsigned build artifact
        uses: actions/upload-artifact@v7
        with:
          name: PulsePing-1.0.4-unsigned-win-x64
          path: artifacts/PulsePing1.0.exe
          if-no-files-found: error

  publish-unsigned-evaluation-archive:
    if: github.event_name == 'workflow_dispatch' && inputs.artifact_run_id != '' && inputs.release_tag != ''
    runs-on: windows-latest
    permissions:
      actions: read
      contents: write

    steps:
      - name: Download verified unsigned artifact
        uses: actions/download-artifact@v8
        with:
          name: PulsePing-1.0.4-unsigned-win-x64
          path: artifacts
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.artifact_run_id }}

      - name: Create evaluation archive
        shell: pwsh
        run: Compress-Archive -LiteralPath artifacts/PulsePing1.0.exe -DestinationPath artifacts/PulsePing1.0-unsigned-win-x64.zip -CompressionLevel Optimal -Force

      - name: Attach archive to existing release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ inputs.release_tag }}" artifacts/PulsePing1.0-unsigned-win-x64.zip --clobber --repo "${{ github.repository }}"

  publish-public-preview:
    needs: build-windows-x64
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Download release executable
        uses: actions/download-artifact@v8
        with:
          name: PulsePing-1.0.4-unsigned-win-x64
          path: artifacts

      - name: Publish unsigned public preview
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $asset = "artifacts/PulsePing-$($env:GITHUB_REF_NAME)-unsigned-win-x64.exe"
          Copy-Item -LiteralPath artifacts/PulsePing1.0.exe -Destination $asset
          gh release create "$env:GITHUB_REF_NAME" $asset --repo "$env:GITHUB_REPOSITORY" --title "PulsePing $env:GITHUB_REF_NAME - public preview" --notes "PulsePing $env:GITHUB_REF_NAME is available as a public preview. This Windows executable is unsigned, so Windows may show an Unknown Publisher warning. Download only from this official PulsePing release page."
